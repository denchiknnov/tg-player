<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TG Music Player Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* === Стили (оптимизированы, без лишних кнопок) === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, #0a0a0a 0%, #121212 100%);
            color: #e0e0e0;
            padding: 16px;
            padding-bottom: 100px;
            min-height: 100vh;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease;
            flex-direction: column;
            gap: 20px;
        }
        .loading-overlay.hidden { display: none; }
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(58, 110, 165, 0.2);
            border-top: 4px solid #3a6ea5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .loading-text { color: #3a6ea5; font-size: 16px; font-weight: 500; letter-spacing: 1px; }
        .loading-progress {
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }
        .loading-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3a6ea5, #5a8ec5);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 4px;
        }
        .loading-step { font-size: 12px; color: #888; margin-top: 8px; }
        .player-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #12121a 100%);
            border-radius: 32px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.03);
            position: relative;
            overflow: visible;
            transition: opacity 0.3s, filter 0.3s;
        }
        .player-card.loading-blur {
            opacity: 0.6;
            filter: blur(2px);
            pointer-events: none;
        }
        .cover-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto;
            border-radius: 24px;
            overflow: hidden;
            background: linear-gradient(145deg, #1a1a2a, #0f0f1a);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .doubletap-zone {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            z-index: 5;
            cursor: pointer;
        }
        .doubletap-zone.left { left: 0; }
        .doubletap-zone.right { right: 0; }
        .doubletap-toast {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #5a8ec5;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            z-index: 200;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            white-space: nowrap;
            backdrop-filter: blur(8px);
        }
        .cover-container { display: flex; justify-content: center; margin-bottom: 24px; }
        .cover-image { width: 100%; height: 100%; object-fit: cover; }
        .cover-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            background: linear-gradient(145deg, #1a1a2a, #0f0f1a);
        }
        .buffering-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .buffering-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid #5a8ec5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .track-info-container { text-align: center; margin-bottom: 24px; position: relative; z-index: 10; }
        .track-title {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #fff, #aaa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .track-artist { font-size: 0.95rem; color: #888; margin-bottom: 4px; }
        .track-album { font-size: 0.8rem; color: #666; }
        .progress-container { margin: 20px 0; position: relative; z-index: 10; }
        .time-row { display: flex; justify-content: space-between; font-size: 12px; color: #888; margin-bottom: 6px; }
        .progress-bar-wrapper {
            position: relative;
            width: 100%;
            height: 8px;
            background: #2a2a3a;
            border-radius: 10px;
            cursor: pointer;
        }
        .progress-buffer {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: #4a6a8a;
            border-radius: 10px;
            width: 0%;
            pointer-events: none;
            transition: width 0.2s ease;
        }
        .progress-bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: #3a6ea5;
            border-radius: 10px;
            width: 0%;
            z-index: 2;
            pointer-events: none;
            transition: width 0.1s linear;
        }
        .progress-handle {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 18px;
            height: 18px;
            background: #5a8ec5;
            border-radius: 50%;
            cursor: grab;
            box-shadow: 0 0 8px #3a6ea5;
            transition: transform 0.1s;
            z-index: 3;
            pointer-events: auto;
        }
        .progress-handle:active { cursor: grabbing; transform: translate(-50%, -50%) scale(1.2); }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin: 24px 0 12px;
            position: relative;
            z-index: 10;
            flex-wrap: wrap;
        }
        .ctrl-btn {
            background: rgba(30, 30, 40, 0.8);
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #e0e0e0;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            opacity: 0.9;
        }
        .ctrl-btn:active { transform: scale(0.95); opacity: 0.7; background: rgba(58, 110, 165, 0.5); }
        .ctrl-btn.play { background: #3a6ea5; color: white; font-size: 28px; width: 56px; height: 56px; }
        .ctrl-btn.play:active { background: #2a5a8a; }
        .ctrl-btn.stop { background: rgba(200, 60, 60, 0.3); color: #ff6b6b; }
        .ctrl-btn.disabled { opacity: 0.3; pointer-events: none; }
        .playlist-section {
            background: rgba(18, 18, 26, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 0;
            margin-top: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }
        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: wrap;
            gap: 8px;
        }
        .playlist-title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #3a6ea5; display: flex; align-items: center; gap: 8px; }
        .playlist-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .playlist-count { font-size: 11px; color: #888; background: #1a1a2a; padding: 4px 10px; border-radius: 20px; }
        .action-btn {
            background: rgba(30, 30, 40, 0.8);
            border: none;
            color: #e0e0e0;
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            opacity: 0.9;
        }
        .action-btn:active { transform: scale(0.95); opacity: 0.7; background: rgba(58, 110, 165, 0.5); }
        .action-btn.download-fdm { background: rgba(255, 152, 0, 0.3); color: #ffb74d; }
        .action-btn.download-json { background: rgba(46, 125, 50, 0.3); color: #81c784; }
        .action-btn.folder { background: rgba(33, 150, 243, 0.3); color: #64b5f6; }
        .action-btn.reset { background: rgba(200, 60, 60, 0.3); color: #ff6b6b; }
        .track-list { max-height: 400px; overflow-y: auto; }
        .track-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.15s;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }
        .track-item:hover { background: rgba(58, 110, 165, 0.15); }
        .track-item.playing { background: rgba(58, 110, 165, 0.25); border-left: 3px solid #3a6ea5; }
        .track-number { width: 32px; font-size: 12px; color: #666; text-align: center; }
        .track-info { flex: 1; }
        .track-name { font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .track-artist-small { font-size: 11px; color: #888; margin-top: 2px; }
        .now-playing-indicator { font-size: 10px; color: #5a8ec5; animation: pulse 1s infinite; }
        .local-file-badge { font-size: 9px; background: #2e7d32; padding: 2px 6px; border-radius: 20px; margin-left: 8px; }
        .empty, .loading { text-align: center; padding: 40px; color: #666; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .error-toast {
            position: fixed;
            bottom: 120px;
            left: 20px;
            right: 20px;
            background: rgba(200, 60, 60, 0.95);
            color: white;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
            z-index: 300;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .media-session-badge {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(58, 110, 165, 0.3);
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 10px;
            color: #5a8ec5;
            backdrop-filter: blur(4px);
            z-index: 150;
        }
        .confirm-dialog {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a2e;
            border-radius: 24px;
            padding: 24px;
            z-index: 400;
            text-align: center;
            border: 1px solid rgba(58, 110, 165, 0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            display: none;
            min-width: 280px;
        }
        .confirm-dialog.show { display: block; animation: fadeIn 0.2s ease; }
        .confirm-dialog p { margin-bottom: 20px; color: #fff; }
        .confirm-dialog .buttons { display: flex; gap: 12px; justify-content: center; }
        .confirm-dialog button { padding: 8px 24px; border-radius: 40px; border: none; cursor: pointer; font-size: 14px; }
        .confirm-dialog .confirm-btn { background: #ff6b6b; color: white; }
        .confirm-dialog .cancel-btn { background: #2a2a3a; color: #888; }
        @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -50%) scale(0.95); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
    </style>
</head>
<body>

<div id="loadingOverlay" class="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loadingText">Загрузка плейлиста...</div>
    <div class="loading-progress">
        <div class="loading-progress-fill" id="loadingProgressFill"></div>
    </div>
    <div class="loading-step" id="loadingStep">Подключение к серверу...</div>
</div>

<div id="app">
    <div class="player-card" id="playerCard">
        <div class="cover-container">
            <div class="cover-wrapper" id="coverWrapper">
                <div class="doubletap-zone left" id="doubletapLeft"></div>
                <div class="doubletap-zone right" id="doubletapRight"></div>
                <div id="coverPlaceholder" class="cover-placeholder">🎵</div>
                <img id="coverImage" class="cover-image" style="display:none;">
                <div id="bufferingOverlay" class="buffering-overlay">
                    <div class="buffering-spinner"></div>
                </div>
            </div>
        </div>

        <div class="track-info-container">
            <div class="track-title" id="nowPlayingTitle">Загрузка...</div>
            <div class="track-artist" id="nowPlayingArtist"></div>
            <div class="track-album" id="nowPlayingAlbum"></div>
        </div>

        <div class="progress-container">
            <div class="time-row">
                <span id="currentTime">0:00</span>
                <span id="totalTime">0:00</span>
            </div>
            <div class="progress-bar-wrapper" id="progressBar">
                <div class="progress-buffer" id="progressBuffer"></div>
                <div class="progress-bar-fill" id="progressFill"></div>
                <div class="progress-handle" id="progressHandle"></div>
            </div>
        </div>

        <div class="controls">
            <button class="ctrl-btn" id="prevBtn" title="Предыдущий">⏮</button>
            <button class="ctrl-btn stop" id="stopBtn" title="Стоп">⏹️</button>
            <button class="ctrl-btn play" id="playPauseBtn" title="Воспроизвести/Пауза">▶</button>
            <button class="ctrl-btn" id="nextBtn" title="Следующий">⏭</button>
        </div>
    </div>

    <div class="playlist-section">
        <div class="playlist-header">
            <div class="playlist-title">
                <span>🎵</span>
                <span id="currentPlaylistTitle">ПЛЕЙЛИСТ</span>
            </div>
            <div class="playlist-actions">
                <div class="playlist-count" id="playlistCount">0 треков</div>
                <button class="action-btn download-fdm" id="downloadFdmBtn" title="Скачать список ссылок (только URL для FDM)">📄</button>
                <button class="action-btn folder" id="selectFolderBtn" title="Выбрать папку с аудио и JSON">📁</button>
                <button class="action-btn download-json" id="downloadPlaylistBtn" title="Скачать JSON плейлиста (с полями filename и original_filename)">📥</button>
                <button class="action-btn reset" id="resetBtn" title="Сбросить все закладки">🗑️</button>
            </div>
        </div>
        <div id="playlistContainer" class="track-list">
            <div class="loading">
                <div class="buffering-spinner"></div>
                Загрузка плейлиста...
            </div>
        </div>
    </div>
</div>

<div id="doubletapToast" class="doubletap-toast"></div>
<div id="errorToast" class="error-toast"></div>
<div id="mediaSessionBadge" class="media-session-badge" style="display:none;">🎧 Media Session</div>

<div id="confirmDialog" class="confirm-dialog">
    <p>🗑️ Удалить все сохранённые позиции?</p>
    <p style="font-size: 12px; color: #888;">Плеер будет как при первом открытии</p>
    <div class="buttons">
        <button class="cancel-btn" onclick="hideConfirmDialog()">Отмена</button>
        <button class="confirm-btn" onclick="confirmReset()">Да, сбросить</button>
    </div>
</div>

<script>
    // ==================== НАСТРОЙКИ ====================
    const PROXY_URL = "https://script.google.com/macros/s/AKfycbzT-VgBHAxfT9MOeGDlu6_qpz8Tkm1UoGAAO5wGM8nO2vL1jYLYSyi42HGw-rtQOwBWhw/exec";
    
    let tracks = [];
    let currentTrackIndex = -1;
    let isPlaying = false;
    let playlistName = "";
    let coverUrl = null;
    let lastTapTime = 0;
    let urlCache = new Map();          // file_id -> { url, originalName }
    let coverCache = new Map();
    let loadedFileId = null;
    let localAudioFiles = new Map();   // индекс трека -> objectURL (локальный blob)
    
    let currentAudio = null;
    let isCurrentAudioValid = false;
    let savePositionTimer = null;
    let bufferMonitorInterval = null;
    let isDraggingProgress = false;
    let pendingSeekTime = null;
    let stopRequested = false;
    let isPlaylistLoaded = false;
    let isAudioReady = false;
    let isLoadingComplete = false;
    let currentPlayPromise = null;
    let isSwitchingTrack = false;
    let pendingTrackIndex = null;
    let currentAbortController = null;
    
    const elements = {};
    
    // ==================== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ====================
    function normalizeFilename(name) {
        return name.replace(/[<>:"/\\|?*]/g, '_');
    }
    
    function generateReadableFilename(track) {
        let base = (track.artist || 'track') + ' - ' + (track.name || 'audio');
        base = normalizeFilename(base);
        if (base.length > 200) base = base.slice(0, 200);
        return base + '.mp3';
    }
    
    // Транслитерация кириллицы в латиницу для имен файлов
    function transliterate(text) {
        const map = {
            'а': 'a', 'б': 'b', 'в': 'v', 'г': 'g', 'д': 'd', 'е': 'e', 'ё': 'e',
            'ж': 'zh', 'з': 'z', 'и': 'i', 'й': 'y', 'к': 'k', 'л': 'l', 'м': 'm',
            'н': 'n', 'о': 'o', 'п': 'p', 'р': 'r', 'с': 's', 'т': 't', 'у': 'u',
            'ф': 'f', 'х': 'h', 'ц': 'ts', 'ч': 'ch', 'ш': 'sh', 'щ': 'sch', 'ъ': '',
            'ы': 'y', 'ь': '', 'э': 'e', 'ю': 'yu', 'я': 'ya',
            'А': 'A', 'Б': 'B', 'В': 'V', 'Г': 'G', 'Д': 'D', 'Е': 'E', 'Ё': 'E',
            'Ж': 'Zh', 'З': 'Z', 'И': 'I', 'Й': 'Y', 'К': 'K', 'Л': 'L', 'М': 'M',
            'Н': 'N', 'О': 'O', 'П': 'P', 'Р': 'R', 'С': 'S', 'Т': 'T', 'У': 'U',
            'Ф': 'F', 'Х': 'H', 'Ц': 'Ts', 'Ч': 'Ch', 'Ш': 'Sh', 'Щ': 'Sch', 'Ъ': '',
            'Ы': 'Y', 'Ь': '', 'Э': 'E', 'Ю': 'Yu', 'Я': 'Ya'
        };
        return text.split('').map(ch => map[ch] || (ch.match(/[a-zA-Z0-9_\-]/) ? ch : '_')).join('');
    }
    
    function getSafeFileName(baseName) {
        let translit = transliterate(baseName);
        translit = translit.replace(/[^a-zA-Z0-9_\-]/g, '_');
        if (translit.length > 100) translit = translit.slice(0, 100);
        return translit;
    }
    
    // Из URL извлекаем оригинальное имя файла
    function extractOriginalNameFromUrl(url) {
        try {
            const path = new URL(url).pathname;
            const parts = path.split('/');
            let last = parts[parts.length - 1];
            last = last.split('?')[0];
            return last;
        } catch(e) {
            const match = url.match(/\/([^\/?#]+)(?:[?#]|$)/);
            return match ? match[1] : 'file';
        }
    }
    
    // ==================== ДИАЛОГ ПОДТВЕРЖДЕНИЯ ====================
    window.showConfirmDialog = function() {
        document.getElementById('confirmDialog').classList.add('show');
    }
    window.hideConfirmDialog = function() {
        document.getElementById('confirmDialog').classList.remove('show');
    }
    window.confirmReset = function() {
        hideConfirmDialog();
        resetAllBookmarks();
    }
    
    function resetAllBookmarks() {
        if (currentAbortController) currentAbortController.abort();
        if (currentPlayPromise) {
            currentPlayPromise.cancel = true;
            currentPlayPromise = null;
        }
        if (bufferMonitorInterval) clearInterval(bufferMonitorInterval);
        stopRequested = true;
        isSwitchingTrack = true;
        if (currentAudio) { 
            currentAudio.pause(); 
            currentAudio.src = ''; 
            currentAudio.load(); 
            currentAudio = null; 
        }
        isCurrentAudioValid = false;
        if (savePositionTimer) clearTimeout(savePositionTimer);
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && (key.startsWith('playlist_pos_') || key === 'current_playlist_file_id')) keys.push(key);
        }
        keys.forEach(key => localStorage.removeItem(key));
        urlCache.clear();
        coverCache.clear();
        for (const [_, url] of localAudioFiles.entries()) URL.revokeObjectURL(url);
        localAudioFiles.clear();
        currentTrackIndex = -1;
        isPlaying = false;
        isAudioReady = false;
        pendingSeekTime = null;
        if (elements.playPauseBtn) elements.playPauseBtn.innerHTML = '▶';
        updateProgressFill(0);
        if (elements.currentTime) elements.currentTime.textContent = "0:00";
        if (elements.totalTime) elements.totalTime.textContent = "0:00";
        if (elements.progressBuffer) elements.progressBuffer.style.width = '0%';
        if (elements.nowPlayingTitle) elements.nowPlayingTitle.innerHTML = "Готов к воспроизведению";
        if (elements.nowPlayingArtist) elements.nowPlayingArtist.textContent = "";
        if (elements.nowPlayingAlbum) elements.nowPlayingAlbum.textContent = "";
        if (elements.coverImage) { elements.coverImage.style.display = 'none'; elements.coverImage.src = ''; }
        if (elements.coverPlaceholder) elements.coverPlaceholder.style.display = 'flex';
        if (navigator.mediaSession) navigator.mediaSession.playbackState = 'paused';
        showToast("✅ Все закладки удалены");
        setTimeout(() => location.reload(), 500);
    }
    
    function stopPlayback() {
        if (currentAbortController) currentAbortController.abort();
        if (currentPlayPromise) {
            currentPlayPromise.cancel = true;
            currentPlayPromise = null;
        }
        if (bufferMonitorInterval) clearInterval(bufferMonitorInterval);
        if (savePositionTimer) clearTimeout(savePositionTimer);
        if (currentAudio) { 
            currentAudio.pause(); 
            currentAudio.currentTime = 0; 
            isCurrentAudioValid = false; 
        }
        isPlaying = false;
        pendingSeekTime = null;
        if (elements.playPauseBtn) elements.playPauseBtn.innerHTML = '▶';
        updateProgressFill(0);
        if (elements.currentTime) elements.currentTime.textContent = "0:00";
        if (elements.totalTime) elements.totalTime.textContent = "0:00";
        if (elements.progressBuffer) elements.progressBuffer.style.width = '0%';
        if (navigator.mediaSession) navigator.mediaSession.playbackState = 'paused';
        saveCurrentPosition();
        renderPlaylist();
        showToast("⏹️ Воспроизведение остановлено");
    }
    
    // ==================== ЭКСПОРТ ====================
    function downloadPlaylistJSON() {
        if (!tracks.length) { showError("Плейлист пуст"); return; }
        const exportTracks = tracks.map(track => ({
            name: track.name,
            artist: track.artist,
            album: track.album,
            file_id: track.file_id,
            cover_url: track.cover_url,
            cover_file_id: track.cover_file_id,
            original_filename: track.original_filename || '',
            filename: track.filename || generateReadableFilename(track)
        }));
        const jsonData = JSON.stringify(exportTracks, null, 2);
        const blob = new Blob([jsonData], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        // Читаемое имя файла с транслитерацией
        const safeName = getSafeFileName(playlistName);
        a.download = `playlist_${safeName}.json`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
        showToast(`📄 JSON плейлиста сохранён (${tracks.length} треков)`);
    }
    
    function downloadLinksForFDM() {
        if (!tracks.length) { showError("Плейлист пуст"); return; }
        let content = "";
        let missingCount = 0;
        for (const track of tracks) {
            const cached = urlCache.get(track.file_id);
            if (cached && cached.url) {
                content += cached.url + "\n";
            } else {
                missingCount++;
            }
        }
        if (missingCount > 0) showToast(`⚠️ ${missingCount} треков без ссылки`);
        const blob = new Blob([content], {type: 'text/plain;charset=utf-8'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        const safeName = getSafeFileName(playlistName);
        a.download = `playlist_${safeName}_fdm.txt`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
        showToast(`📄 Список ссылок сохранён (${tracks.length - missingCount}/${tracks.length})`);
    }
    
    // ==================== ВЫБОР ПАПКИ (JSON + аудио, сопоставление по original_filename) ====================
    async function selectFolderWithPlaylist() {
        const input = document.createElement('input');
        input.type = 'file';
        input.webkitdirectory = true;
        input.directory = true;
        input.onchange = async (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;
            
            const jsonFile = files.find(f => f.name.endsWith('.json'));
            if (!jsonFile) { showError("В папке не найден .json файл с плейлистом"); return; }
            
            let newTracks = [];
            try {
                const text = await jsonFile.text();
                const parsed = JSON.parse(text);
                if (!Array.isArray(parsed)) throw new Error("Не массив");
                newTracks = parsed.filter(t => t.name && t.file_id).map(t => ({
                    name: t.name, artist: t.artist || "Неизвестен", album: t.album || "",
                    file_id: t.file_id, cover_url: t.cover_url || null, cover_file_id: t.cover_file_id || null,
                    original_filename: t.original_filename || '',
                    filename: t.filename || generateReadableFilename(t)
                }));
                if (!newTracks.length) throw new Error("Нет треков");
            } catch(err) { showError("Ошибка чтения JSON: " + err.message); return; }
            
            for (const [_, url] of localAudioFiles.entries()) URL.revokeObjectURL(url);
            localAudioFiles.clear();
            urlCache.clear();
            
            tracks = newTracks;
            playlistName = tracks[0]?.album || tracks[0]?.artist || "Офлайн плейлист";
            if (elements.currentPlaylistTitle) elements.currentPlaylistTitle.textContent = playlistName.toUpperCase();
            coverUrl = tracks[0]?.cover_url || null;
            if (elements.playlistCount) elements.playlistCount.textContent = `${tracks.length} треков`;
            
            const audioCandidates = files.filter(f => f !== jsonFile);
            for (let i = 0; i < tracks.length; i++) {
                const track = tracks[i];
                let matchedFile = null;
                // 1. По original_filename
                if (track.original_filename) {
                    const originalBase = track.original_filename.replace(/\.mp3$/, '').toLowerCase();
                    for (const file of audioCandidates) {
                        const fileNameBase = file.name.replace(/\.[^/.]+$/, '').toLowerCase();
                        if (fileNameBase === originalBase) {
                            matchedFile = file;
                            break;
                        }
                    }
                }
                // 2. По читаемому имени (filename)
                if (!matchedFile && track.filename) {
                    const readableBase = track.filename.replace(/\.mp3$/, '').toLowerCase();
                    for (const file of audioCandidates) {
                        const fileNameBase = file.name.replace(/\.[^/.]+$/, '').toLowerCase();
                        if (fileNameBase === readableBase) {
                            matchedFile = file;
                            break;
                        }
                    }
                }
                // 3. По номеру трека
                if (!matchedFile) {
                    const numMatch = track.name.match(/\d+/);
                    if (numMatch) {
                        const num = parseInt(numMatch[0], 10);
                        for (const file of audioCandidates) {
                            if (file.name.match(new RegExp(`\\b${num}\\b`))) {
                                matchedFile = file;
                                break;
                            }
                        }
                    }
                }
                if (matchedFile) {
                    const blobUrl = URL.createObjectURL(matchedFile);
                    localAudioFiles.set(i, blobUrl);
                }
            }
            
            currentTrackIndex = -1;
            isPlaying = false;
            if (currentAudio) { currentAudio.pause(); currentAudio = null; }
            isCurrentAudioValid = false;
            renderPlaylist();
            if (tracks.length) updateTrackInfo(tracks[0]);
            showToast(`✅ Загружено: ${tracks.length} треков, локально найдено ${localAudioFiles.size}`);
            isPlaylistLoaded = true;
            isAudioReady = true;
            hideLoadingOverlay();
        };
        input.click();
    }
    
    // ==================== MEDIA SESSION ====================
    function setupMediaSession() {
        if (!('mediaSession' in navigator)) return;
        document.getElementById('mediaSessionBadge').style.display = 'block';
        navigator.mediaSession.setActionHandler('play', () => { if (isPlaylistLoaded && !stopRequested) playPause(); });
        navigator.mediaSession.setActionHandler('pause', () => { if (isPlaylistLoaded && !stopRequested) playPause(); });
        navigator.mediaSession.setActionHandler('previoustrack', () => { if (isPlaylistLoaded && !stopRequested) prevTrack(); });
        navigator.mediaSession.setActionHandler('nexttrack', () => { if (isPlaylistLoaded && !stopRequested) nextTrack(); });
        try {
            navigator.mediaSession.setActionHandler('seekto', (details) => {
                if (currentAudio && isCurrentAudioValid && details.seekTime !== undefined) {
                    currentAudio.currentTime = Math.min(details.seekTime, currentAudio.duration);
                    updateUIForCurrentTime();
                    saveCurrentPosition();
                }
            });
        } catch(e) {}
    }
    
    function updateMediaSessionInfo(track, isPlayingState) {
        if (!('mediaSession' in navigator) || !track) return;
        let artworkUrl = track.cover_url || coverUrl;
        let artwork = artworkUrl && artworkUrl.startsWith('http') ? [{ src: artworkUrl, sizes: '512x512', type: 'image/jpeg' }] : [];
        try {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: track.name || 'Без названия',
                artist: track.artist || 'Неизвестен',
                album: track.album || 'Плейлист',
                artwork: artwork
            });
            navigator.mediaSession.playbackState = isPlayingState ? 'playing' : 'paused';
            if (currentAudio && currentAudio.duration && isCurrentAudioValid) updateMediaSessionPosition();
        } catch(e) {}
    }
    
    function updateMediaSessionPosition() {
        if (!('mediaSession' in navigator) || !currentAudio || !currentAudio.duration || !isCurrentAudioValid) return;
        try {
            navigator.mediaSession.setPositionState({ duration: currentAudio.duration, position: currentAudio.currentTime, playbackRate: 1 });
        } catch(e) {}
    }
    
    function showLoadingOverlay() {
        document.getElementById('loadingOverlay').classList.remove('hidden');
        if (elements.playerCard) elements.playerCard.classList.add('loading-blur');
        document.querySelectorAll('.ctrl-btn').forEach(btn => btn.classList.add('disabled'));
    }
    function hideLoadingOverlay() {
        const overlay = document.getElementById('loadingOverlay');
        if (overlay) {
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.classList.add('hidden');
                overlay.style.opacity = '';
            }, 300);
        }
        if (elements.playerCard) elements.playerCard.classList.remove('loading-blur');
        document.querySelectorAll('.ctrl-btn').forEach(btn => btn.classList.remove('disabled'));
    }
    function checkAndHideOverlay() {
        if (isPlaylistLoaded && isAudioReady && !isLoadingComplete) {
            isLoadingComplete = true;
            setTimeout(() => hideLoadingOverlay(), 500);
        }
    }
    function setAudioReady() { isAudioReady = true; checkAndHideOverlay(); }
    
    const storage = {
        get(key) { try { return JSON.parse(localStorage.getItem(key)); } catch(e) { return null; } },
        set(key, value) { localStorage.setItem(key, JSON.stringify(value)); }
    };
    function getStorageKey() { return loadedFileId ? `playlist_pos_${loadedFileId}` : null; }
    function saveCurrentPosition() {
        if (!currentAudio || !currentAudio.duration || currentTrackIndex < 0 || !isCurrentAudioValid) return;
        const key = getStorageKey();
        if (key) storage.set(key, { trackIndex: currentTrackIndex, currentTime: currentAudio.currentTime, timestamp: Date.now() });
    }
    function loadSavedPosition() {
        const key = getStorageKey();
        if (!key) return null;
        const pos = storage.get(key);
        if (pos && pos.trackIndex < tracks.length && Date.now() - pos.timestamp < 30*24*3600000 && pos.currentTime > 0 && pos.currentTime < 100) return pos;
        return null;
    }
    
    function cleanupAudio(audio) {
        if (!audio) return;
        audio.pause();
        audio.src = '';
        audio.load();
        audio.onloadstart = audio.onprogress = audio.onloadedmetadata = audio.ontimeupdate = null;
        audio.onended = audio.onerror = audio.oncanplay = null;
    }
    function updateBufferIndicator() {
        if (!currentAudio || !isCurrentAudioValid || !currentAudio.duration) {
            if (elements.progressBuffer) elements.progressBuffer.style.width = '0%';
            return;
        }
        if (currentAudio.buffered.length) {
            const percent = (currentAudio.buffered.end(currentAudio.buffered.length-1) / currentAudio.duration) * 100;
            if (elements.progressBuffer) elements.progressBuffer.style.width = Math.min(100, percent) + '%';
        } else {
            if (elements.progressBuffer) elements.progressBuffer.style.width = '0%';
        }
    }
    function onTimeUpdate() {
        if (stopRequested || isDraggingProgress || !currentAudio || !isCurrentAudioValid) return;
        if (!currentAudio.duration) return;
        const percent = (currentAudio.currentTime / currentAudio.duration) * 100;
        updateProgressFill(percent);
        if (elements.currentTime) elements.currentTime.textContent = formatTime(currentAudio.currentTime);
        if (elements.totalTime) elements.totalTime.textContent = formatTime(currentAudio.duration);
        updateMediaSessionPosition();
        if (isPlaying && !isDraggingProgress) saveCurrentPosition();
        updateBufferIndicator();
    }
    function onLoadedMetadata() {
        if (stopRequested || !currentAudio || !isCurrentAudioValid) return;
        if (elements.totalTime) elements.totalTime.textContent = formatTime(currentAudio.duration);
        updateMediaSessionPosition();
        if (pendingSeekTime && pendingSeekTime > 0 && currentAudio.duration && pendingSeekTime < currentAudio.duration) {
            currentAudio.currentTime = pendingSeekTime;
            const percent = (pendingSeekTime / currentAudio.duration) * 100;
            updateProgressFill(percent);
            if (elements.currentTime) elements.currentTime.textContent = formatTime(pendingSeekTime);
            pendingSeekTime = null;
            updateMediaSessionPosition();
        }
        updateBufferIndicator();
    }
    function onProgress() { if (!stopRequested && isCurrentAudioValid) updateBufferIndicator(); }
    function onCanPlay() { if (!stopRequested && isCurrentAudioValid) { setAudioReady(); updateBufferIndicator(); } }
    function onEnded() {
        if (!stopRequested && !isSwitchingTrack && isCurrentAudioValid) {
            saveCurrentPosition();
            setTimeout(() => { if (!stopRequested && !isSwitchingTrack) nextTrack(); }, 100);
        }
    }
    function onError(e) { console.error(e); if (isCurrentAudioValid) showError("Ошибка воспроизведения"); setAudioReady(); }
    function setupAudioEvents(audio) {
        if (!audio) return;
        audio.onloadedmetadata = onLoadedMetadata;
        audio.ontimeupdate = onTimeUpdate;
        audio.onended = onEnded;
        audio.onerror = onError;
        audio.oncanplay = onCanPlay;
        audio.onprogress = onProgress;
    }
    function startBufferMonitor() {
        if (bufferMonitorInterval) clearInterval(bufferMonitorInterval);
        bufferMonitorInterval = setInterval(() => {
            if (currentAudio && !stopRequested && !isSwitchingTrack && isCurrentAudioValid) updateBufferIndicator();
        }, 500);
    }
    
    async function playTrack(index, restoreTime) {
        if (isSwitchingTrack) { pendingTrackIndex = index; return; }
        if (stopRequested) { stopRequested = false; return; }
        if (!tracks[index]) return;
        isSwitchingTrack = true;
        if (currentAbortController) currentAbortController.abort();
        if (currentPlayPromise) {
            currentPlayPromise.cancel = true;
            currentPlayPromise = null;
        }
        if (currentAudio) {
            isCurrentAudioValid = false;
            currentAudio.pause();
            cleanupAudio(currentAudio);
            currentAudio = null;
        }
        
        const track = tracks[index];
        updateTrackInfo(track);
        updateMediaSessionInfo(track, true);
        currentTrackIndex = index;
        renderPlaylist();
        
        const bufferingOverlay = document.getElementById('bufferingOverlay');
        if (bufferingOverlay) bufferingOverlay.style.display = 'flex';
        
        // Локальный файл
        if (localAudioFiles.has(index)) {
            const blobUrl = localAudioFiles.get(index);
            const audio = new Audio();
            audio.src = blobUrl;
            if (restoreTime && restoreTime > 0) pendingSeekTime = restoreTime;
            setupAudioEvents(audio);
            currentAudio = audio;
            isCurrentAudioValid = true;
            startBufferMonitor();
            try {
                await audio.play();
                isPlaying = true;
                if (elements.playPauseBtn) elements.playPauseBtn.innerHTML = '⏸';
                if (navigator.mediaSession) navigator.mediaSession.playbackState = 'playing';
                updateMediaSessionPosition();
                if (bufferingOverlay) bufferingOverlay.style.display = 'none';
                isSwitchingTrack = false;
                if (pendingTrackIndex !== null && pendingTrackIndex !== index) {
                    const next = pendingTrackIndex;
                    pendingTrackIndex = null;
                    setTimeout(() => playTrack(next, null), 50);
                }
                return;
            } catch(e) { console.warn("Local play failed", e); }
        }
        
        // Онлайн
        const cached = urlCache.get(track.file_id);
        if (!cached || !cached.url) {
            showError(`Не удалось загрузить: ${track.name}`);
            isSwitchingTrack = false;
            if (bufferingOverlay) bufferingOverlay.style.display = 'none';
            return;
        }
        const url = cached.url;
        const abortController = new AbortController();
        currentAbortController = abortController;
        const audioToPlay = new Audio();
        audioToPlay.src = url;
        audioToPlay.preload = 'auto';
        if (restoreTime && restoreTime > 0) pendingSeekTime = restoreTime;
        setupAudioEvents(audioToPlay);
        let canPlayTimeout = setTimeout(() => abortController.abort(), 15000);
        await new Promise((resolve, reject) => {
            const onCanPlay = () => {
                clearTimeout(canPlayTimeout);
                audioToPlay.removeEventListener('canplay', onCanPlay);
                resolve();
            };
            audioToPlay.addEventListener('canplay', onCanPlay);
            if (audioToPlay.readyState >= 3) {
                clearTimeout(canPlayTimeout);
                resolve();
            }
            abortController.signal.addEventListener('abort', () => {
                clearTimeout(canPlayTimeout);
                audioToPlay.removeEventListener('canplay', onCanPlay);
                reject(new Error('Aborted'));
            });
        });
        if (abortController.signal.aborted) {
            isSwitchingTrack = false;
            return;
        }
        currentAudio = audioToPlay;
        isCurrentAudioValid = true;
        startBufferMonitor();
        await currentAudio.play();
        isPlaying = true;
        if (elements.playPauseBtn) elements.playPauseBtn.innerHTML = '⏸';
        if (navigator.mediaSession) navigator.mediaSession.playbackState = 'playing';
        updateMediaSessionPosition();
        if (bufferingOverlay) bufferingOverlay.style.display = 'none';
        isSwitchingTrack = false;
        if (pendingTrackIndex !== null && pendingTrackIndex !== index) {
            const next = pendingTrackIndex;
            pendingTrackIndex = null;
            setTimeout(() => playTrack(next, null), 50);
        }
    }
    
    function nextTrack() {
        if (!tracks.length) return;
        let idx = (currentTrackIndex + 1) % tracks.length;
        playTrack(idx, null);
    }
    function prevTrack() {
        if (!tracks.length) return;
        if (currentAudio && isCurrentAudioValid && currentAudio.currentTime > 3) {
            currentAudio.currentTime = 0;
            showToast("⏪ В начало");
        } else {
            let idx = currentTrackIndex - 1;
            if (idx < 0) idx = tracks.length - 1;
            playTrack(idx, null);
        }
    }
    function playPause() {
        if (!tracks.length) return;
        if (currentTrackIndex < 0) { playTrack(0, null); return; }
        if (isPlaying) {
            if (currentAudio) currentAudio.pause();
            isPlaying = false;
            if (elements.playPauseBtn) elements.playPauseBtn.innerHTML = '▶';
            saveCurrentPosition();
            if (navigator.mediaSession) navigator.mediaSession.playbackState = 'paused';
        } else {
            if (currentAudio && currentAudio.src) {
                currentAudio.play().then(() => {
                    isPlaying = true;
                    if (elements.playPauseBtn) elements.playPauseBtn.innerHTML = '⏸';
                    if (navigator.mediaSession) navigator.mediaSession.playbackState = 'playing';
                }).catch(e => {
                    if (tracks[currentTrackIndex]) playTrack(currentTrackIndex, null);
                });
            } else if (tracks[currentTrackIndex]) {
                playTrack(currentTrackIndex, null);
            }
        }
    }
    
    function formatTime(sec) {
        if (!sec || isNaN(sec)) return "0:00";
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m}:${s.toString().padStart(2, '0')}`;
    }
    function updateProgressFill(percent) {
        if (elements.progressFill) elements.progressFill.style.width = percent + '%';
        if (elements.progressHandle) elements.progressHandle.style.left = percent + '%';
    }
    function updateUIForCurrentTime() {
        if (!currentAudio) return;
        const percent = (currentAudio.currentTime / currentAudio.duration) * 100;
        updateProgressFill(percent);
        if (elements.currentTime) elements.currentTime.textContent = formatTime(currentAudio.currentTime);
    }
    
    function renderPlaylist() {
        if (!elements.playlistContainer || !tracks.length) {
            if (elements.playlistContainer) elements.playlistContainer.innerHTML = '<div class="empty">📭 Плейлист пуст</div>';
            return;
        }
        const container = elements.playlistContainer;
        container.innerHTML = '';
        tracks.forEach((track, idx) => {
            const div = document.createElement('div');
            div.className = 'track-item' + (idx === currentTrackIndex ? ' playing' : '');
            let localBadge = localAudioFiles.has(idx) ? '<span class="local-file-badge">📁 локальный</span>' : '';
            div.innerHTML = `
                <div class="track-number">${String(idx+1).padStart(2, '0')}</div>
                <div class="track-info">
                    <div class="track-name">
                        ${escapeHtml(track.name)} ${localBadge}
                        ${idx === currentTrackIndex ? '<span class="now-playing-indicator">▶</span>' : ''}
                    </div>
                    <div class="track-artist-small">${escapeHtml(track.artist || 'Неизвестен')}</div>
                </div>
            `;
            div.onclick = () => {
                if (stopRequested) stopRequested = false;
                playTrack(idx, null);
            };
            container.appendChild(div);
        });
    }
    
    function setupProgressDrag() {
        const progressBar = elements.progressBar;
        const handle = elements.progressHandle;
        const fill = elements.progressFill;
        if (!progressBar || !handle) return;
        let pendingSeekLocal = null;
        const onMove = (e) => {
            if (!isDraggingProgress) return;
            e.preventDefault();
            const rect = progressBar.getBoundingClientRect();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let percent = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
            fill.style.width = (percent * 100) + '%';
            handle.style.left = (percent * 100) + '%';
            if (currentAudio && currentAudio.duration && isCurrentAudioValid) {
                pendingSeekLocal = percent * currentAudio.duration;
                if (elements.currentTime) elements.currentTime.textContent = formatTime(pendingSeekLocal);
            }
        };
        const onUp = () => {
            if (isDraggingProgress && pendingSeekLocal !== null && currentAudio && isCurrentAudioValid) {
                currentAudio.currentTime = pendingSeekLocal;
                saveCurrentPosition();
                pendingSeekLocal = null;
            }
            isDraggingProgress = false;
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
            document.removeEventListener('touchmove', onMove);
            document.removeEventListener('touchend', onUp);
        };
        const onDown = (e) => {
            e.preventDefault(); e.stopPropagation();
            isDraggingProgress = true;
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
            document.addEventListener('touchmove', onMove);
            document.addEventListener('touchend', onUp);
            onMove(e);
        };
        handle.addEventListener('mousedown', onDown);
        handle.addEventListener('touchstart', onDown);
        progressBar.addEventListener('click', (e) => {
            if (isDraggingProgress) return;
            const rect = progressBar.getBoundingClientRect();
            let clientX = e.clientX;
            if (e.touches) clientX = e.touches[0].clientX;
            let percent = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
            if (currentAudio && currentAudio.duration && isCurrentAudioValid) {
                currentAudio.currentTime = percent * currentAudio.duration;
                updateUIForCurrentTime();
                saveCurrentPosition();
                updateMediaSessionPosition();
            }
        });
    }
    
    function setupDoubleTap() {
        const left = document.getElementById('doubletapLeft');
        const right = document.getElementById('doubletapRight');
        const handler = (direction) => {
            if (stopRequested) { showToast("Плеер остановлен, нажмите Play"); return; }
            const now = Date.now();
            if (now - lastTapTime < 300) {
                const skip = direction === 'left' ? -10 : 10;
                if (currentAudio && currentAudio.duration && isCurrentAudioValid) {
                    let newTime = currentAudio.currentTime + skip;
                    newTime = Math.max(0, Math.min(newTime, currentAudio.duration));
                    currentAudio.currentTime = newTime;
                    showToast(`${skip > 0 ? '⏩' : '⏪'} ${Math.abs(skip)} сек`);
                    updateMediaSessionPosition();
                }
                lastTapTime = 0;
            } else {
                lastTapTime = now;
                showToast(`📱 Двойной тап ${direction === 'left' ? '-10' : '+10'} сек`);
            }
        };
        if (left) left.addEventListener('click', () => handler('left'));
        if (right) right.addEventListener('click', () => handler('right'));
    }
    
    function showToast(msg) {
        const toast = document.getElementById('doubletapToast');
        if (!toast) return;
        toast.textContent = msg;
        toast.style.opacity = '1';
        setTimeout(() => toast.style.opacity = '0', 800);
    }
    function showError(msg) {
        console.error(msg);
        const toast = document.getElementById('errorToast');
        if (!toast) return;
        toast.textContent = msg;
        toast.style.opacity = '1';
        setTimeout(() => toast.style.opacity = '0', 3000);
    }
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
    }
    
    function updateTrackInfo(track) {
        if (!track) return;
        if (elements.nowPlayingTitle) elements.nowPlayingTitle.innerHTML = escapeHtml(track.name);
        if (elements.nowPlayingArtist) elements.nowPlayingArtist.textContent = track.artist || "";
        if (elements.nowPlayingAlbum) elements.nowPlayingAlbum.textContent = track.album ? `📀 ${track.album}` : "";
        let imgUrl = track.cover_url || coverUrl;
        if (imgUrl && imgUrl.startsWith('http')) {
            if (elements.coverImage) {
                elements.coverImage.src = imgUrl;
                elements.coverImage.style.display = 'block';
            }
            if (elements.coverPlaceholder) elements.coverPlaceholder.style.display = 'none';
        } else {
            if (elements.coverImage) elements.coverImage.style.display = 'none';
            if (elements.coverPlaceholder) elements.coverPlaceholder.style.display = 'flex';
        }
    }
    
    // ==================== ЗАГРУЗКА ОНЛАЙН ====================
    async function loadCoverUrls() {
        const coverIds = tracks.filter(t => t.cover_file_id && !coverCache.has(t.cover_file_id)).map(t => t.cover_file_id);
        if (!coverIds.length) return;
        try {
            const resp = await fetch(`${PROXY_URL}?image_ids=${coverIds.join(',')}`);
            const data = await resp.json();
            if (data.ok && data.urls) {
                for (const [id, url] of Object.entries(data.urls)) coverCache.set(id, url);
                for (const t of tracks) if (t.cover_file_id && coverCache.has(t.cover_file_id)) t.cover_url = coverCache.get(t.cover_file_id);
            }
        } catch(e) {}
    }
    
    async function preloadAllAudioUrls() {
        if (!tracks.length) return;
        const ids = tracks.map(t => t.file_id).join(',');
        try {
            const resp = await fetch(`${PROXY_URL}?ids=${ids}`);
            const data = await resp.json();
            if (data.ok && data.urls) {
                for (const [id, url] of Object.entries(data.urls)) {
                    const originalName = extractOriginalNameFromUrl(url);
                    urlCache.set(id, { url, originalName });
                }
                if (elements.playlistCount) elements.playlistCount.textContent = `${tracks.length} треков`;
            }
        } catch(e) { showError("Ошибка загрузки треков"); }
    }
    
    async function loadPlaylistByFileId(fileId) {
        if (loadedFileId === fileId && tracks.length) { isPlaylistLoaded = true; checkAndHideOverlay(); return; }
        showLoadingOverlay();
        try {
            const resp = await fetch(`${PROXY_URL}?file_id=${encodeURIComponent(fileId)}&as_text=1`);
            const text = await resp.text();
            let data = JSON.parse(text);
            if (!Array.isArray(data)) throw new Error("Неверный формат");
            tracks = data.filter(t => t.name && t.file_id).map(t => {
                const cached = urlCache.get(t.file_id);
                const original = cached ? cached.originalName : '';
                return {
                    name: t.name, artist: t.artist || "Неизвестен", album: t.album || "",
                    file_id: t.file_id, cover_url: t.cover_url || null, cover_file_id: t.cover_file_id || null,
                    original_filename: original,
                    filename: t.filename || generateReadableFilename(t)
                };
            });
            if (!tracks.length) throw new Error("Нет треков");
            await loadCoverUrls();
            playlistName = tracks[0]?.album || tracks[0]?.artist || "Мой плейлист";
            loadedFileId = fileId;
            if (elements.currentPlaylistTitle) elements.currentPlaylistTitle.textContent = playlistName.toUpperCase();
            coverUrl = tracks[0]?.cover_url || null;
            await preloadAllAudioUrls();
            for (const t of tracks) {
                const cached = urlCache.get(t.file_id);
                if (cached && cached.originalName) t.original_filename = cached.originalName;
                if (!t.filename) t.filename = generateReadableFilename(t);
            }
            const saved = loadSavedPosition();
            if (saved && saved.trackIndex < tracks.length) {
                currentTrackIndex = saved.trackIndex;
                updateTrackInfo(tracks[currentTrackIndex]);
                renderPlaylist();
            } else {
                currentTrackIndex = 0;
                updateTrackInfo(tracks[0]);
                renderPlaylist();
            }
            isPlaylistLoaded = true;
            hideLoadingOverlay();
        } catch(e) {
            console.error(e);
            isPlaylistLoaded = true; isAudioReady = true;
            hideLoadingOverlay();
            if (elements.playlistContainer) elements.playlistContainer.innerHTML = `<div class="empty">❌ Ошибка: ${e.message}</div>`;
            showError("Не удалось загрузить плейлист");
        }
    }
    
    function getFileIdToLoad() {
        const urlParams = new URLSearchParams(window.location.search);
        let id = urlParams.get('playlist');
        if (id && id.length > 5) return id;
        try {
            const start = window.Telegram?.WebApp?.initDataUnsafe?.start_param;
            if (start && start.startsWith('playlist_')) return start.substring(9);
            if (start && start.length > 20) return start;
        } catch(e) {}
        const hash = window.location.hash.substring(1);
        if (hash && hash.length > 20) return hash;
        return null;
    }
    
    function initDOM() {
        elements.coverImage = document.getElementById('coverImage');
        elements.coverPlaceholder = document.getElementById('coverPlaceholder');
        elements.nowPlayingTitle = document.getElementById('nowPlayingTitle');
        elements.nowPlayingArtist = document.getElementById('nowPlayingArtist');
        elements.nowPlayingAlbum = document.getElementById('nowPlayingAlbum');
        elements.currentTime = document.getElementById('currentTime');
        elements.totalTime = document.getElementById('totalTime');
        elements.progressBar = document.getElementById('progressBar');
        elements.progressBuffer = document.getElementById('progressBuffer');
        elements.progressFill = document.getElementById('progressFill');
        elements.progressHandle = document.getElementById('progressHandle');
        elements.playPauseBtn = document.getElementById('playPauseBtn');
        elements.prevBtn = document.getElementById('prevBtn');
        elements.nextBtn = document.getElementById('nextBtn');
        elements.playlistContainer = document.getElementById('playlistContainer');
        elements.currentPlaylistTitle = document.getElementById('currentPlaylistTitle');
        elements.playlistCount = document.getElementById('playlistCount');
        elements.playerCard = document.getElementById('playerCard');
        
        if (elements.playPauseBtn) elements.playPauseBtn.onclick = playPause;
        if (elements.nextBtn) elements.nextBtn.onclick = nextTrack;
        if (elements.prevBtn) elements.prevBtn.onclick = prevTrack;
        const stopBtn = document.getElementById('stopBtn');
        if (stopBtn) stopBtn.onclick = stopPlayback;
        const resetBtn = document.getElementById('resetBtn');
        if (resetBtn) resetBtn.onclick = () => showConfirmDialog();
        const downloadPlaylist = document.getElementById('downloadPlaylistBtn');
        if (downloadPlaylist) downloadPlaylist.onclick = downloadPlaylistJSON;
        const downloadFdm = document.getElementById('downloadFdmBtn');
        if (downloadFdm) downloadFdm.onclick = downloadLinksForFDM;
        const selectFolder = document.getElementById('selectFolderBtn');
        if (selectFolder) selectFolder.onclick = selectFolderWithPlaylist;
    }
    
    function init() {
        if (window.Telegram && window.Telegram.WebApp) { 
            window.Telegram.WebApp.ready(); 
            window.Telegram.WebApp.expand(); 
        }
        initDOM();
        setupProgressDrag();
        setupDoubleTap();
        setupMediaSession();
        const id = getFileIdToLoad();
        if (id) loadPlaylistByFileId(id);
        else {
            isPlaylistLoaded = true; isAudioReady = true;
            hideLoadingOverlay();
            if (elements.playlistContainer) elements.playlistContainer.innerHTML = '<div class="empty">❌ Не указан плейлист. Используйте 📁 для загрузки папки с JSON и аудио.</div>';
            showError("ID плейлиста не найден, выберите папку вручную");
        }
    }
    
    init();
</script>
